<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="emlog">
<meta name="mobile-web-app-capable" content="yes">
<title>emlog — prototype</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --canvas:#0b0b0f;
  --text:#f4f4f6; --dim:#7e7e88; --dimmer:#4f4f59;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.07);
  --glass-line:rgba(255,255,255,.09);
  --hair:rgba(255,255,255,.06);
  --ac:#f3aa78; --ac2:#f6c39c; --glow:rgba(243,170,120,.30);
  --m1:#586588; --m2:#76859f; --m3:#9a9aa4; --m4:#efb98e; --m5:#f3aa78;
  --danger:#d98a8a;
  --sans:'Zen Kaku Gothic New','Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'Space Grotesk',ui-monospace,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--canvas);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  min-height:100dvh;overflow:hidden;
}
/* device frame */
#root{display:flex;align-items:center;justify-content:center;}
.device{
  width:390px;height:min(844px,100dvh);background:var(--bg);position:relative;overflow:hidden;
  border-radius:46px;box-shadow:0 50px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);
  display:flex;flex-direction:column;
}
@media (max-width:430px){ .device{border-radius:0;height:100dvh;width:100vw;} body{background:#000;} }

/* ambient accent glow */
.aura{position:absolute;top:-130px;left:50%;transform:translateX(-50%);width:420px;height:420px;
  border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--glow),transparent 70%);z-index:0;}
.aura.b{top:auto;bottom:70px;left:-70px;width:260px;height:260px;opacity:.45;transform:none;
  background:radial-gradient(circle,var(--glow),transparent 70%);}

.screen{flex:1;min-height:0;position:relative;z-index:2;display:flex;flex-direction:column;}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 28px 16px;
  scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------- shared type ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:4px;text-transform:uppercase;
  color:var(--ac);font-weight:600;}
.greet{font-size:39px;font-weight:300;letter-spacing:-1.5px;line-height:1.0;margin-top:14px;}
.h1{font-size:30px;font-weight:300;letter-spacing:-1px;}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--dim);font-weight:600;}
.hero{padding:22px 2px 20px;}
/* compact log header (date only) */
.log-head{display:flex;align-items:center;padding:18px 2px 16px;}
.log-date{font-size:15px;font-weight:500;color:var(--dim);letter-spacing:.5px;}
.sec{margin-bottom:24px;}
.sec>.lbl{display:block;margin-bottom:16px;}

/* ---------- mood ---------- */
.moods{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
.mood{display:flex;flex-direction:column;align-items:center;gap:11px;flex:1;cursor:pointer;
  background:none;border:none;}
.dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:.35s cubic-bezier(.34,1.45,.5,1);}
.face{width:66%;height:66%;display:block;}
.mood:active .dot{transform:scale(.9);}
.moods.has .mood:not(.sel){opacity:.38;}
.mood.sel .dot{width:58px;height:58px;box-shadow:0 12px 40px -8px var(--glow),0 0 0 1px rgba(255,255,255,.14);}
.mw{font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:.5px;height:0;overflow:hidden;}
.moods.has .mood.sel .mw{height:auto;}
.moods:not(.has) .mw{color:var(--dim);font-weight:500;height:0;}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:10px 15px;border-radius:16px;font-size:13px;color:var(--dim);font-weight:500;
  display:inline-flex;gap:6px;align-items:center;background:var(--glass);cursor:pointer;border:none;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:.18s;
  min-width:0;white-space:nowrap;}
.chip:active{transform:scale(.95);}
.chip.on{color:var(--text);font-weight:600;background:color-mix(in srgb,var(--ac) 18%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 38%,transparent);}
.chip.ghost{background:none;box-shadow:inset 0 0 0 1px var(--hair);color:var(--dimmer);}
/* tag icon */
.tag-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.chip.on .tag-ic{opacity:1;}
/* time group labels */
.time-lbl{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--dimmer);font-weight:600;margin:14px 0 9px;}
.chip.neg.on{color:var(--text);font-weight:600;background:color-mix(in srgb,var(--m2) 26%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--m2) 50%,transparent);}
.grp-lbl{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--m2);font-weight:600;margin:16px 0 11px;display:flex;align-items:center;gap:8px;}
.grp-lbl::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--m2);}

/* ---------- glass card + inputs ---------- */
.card{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);border-radius:28px;padding:20px;
  box-shadow:inset 0 1px 0 var(--glass-line),0 20px 50px -34px rgba(0,0,0,.85);}
textarea.ta{width:100%;background:none;border:none;outline:none;color:var(--text);
  font-family:var(--sans);font-size:15.5px;line-height:1.85;letter-spacing:.2px;resize:none;
  min-height:48px;}
textarea.ta::placeholder{color:var(--dimmer);}
.why{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.22,.9,.3,1),opacity .3s,margin .3s,padding .3s;}
.why.show{max-height:240px;opacity:1;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);}
.why .wl{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--ac);font-weight:600;margin-bottom:8px;}
.why textarea.ta{font-size:14px;color:var(--dim);min-height:36px;}

/* ---------- memory ---------- */
.mem{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
.mem-row{display:flex;gap:13px;align-items:center;padding:2px 4px;cursor:pointer;}
.mem-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px var(--glow);}
.mem-when{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ac);font-weight:600;white-space:nowrap;}
.mem-text{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- nav ---------- */
.nav{flex:0 0 auto;position:relative;z-index:3;margin:0 22px 22px;border-radius:28px;
  background:rgba(20,20,22,.55);backdrop-filter:blur(30px) saturate(1.4);
  -webkit-backdrop-filter:blur(30px) saturate(1.4);
  box-shadow:inset 0 1px 0 var(--glass-line),0 20px 50px -20px rgba(0,0,0,.7);
  display:flex;align-items:center;padding:13px 12px;}
.tab{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--dimmer);
  background:none;border:none;cursor:pointer;transition:.2s;height:34px;}
.tab .ic{width:23px;height:23px;}
.tab .tl{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.3px;
  max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s;}
.tab.on{color:var(--ac);flex:0 0 auto;padding:0 17px;border-radius:18px;
  background:color-mix(in srgb,var(--ac) 16%,transparent);}
.tab.on .tl{max-width:90px;}
/* settings button (icon only) sits at the right edge of nav */
.tab-set{flex:0 0 auto;}
.tab-set .ic{width:21px;height:21px;}

/* ---------- toast ---------- */
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%) translateY(-16px);
  background:color-mix(in srgb,var(--ac) 88%,#000);color:#1a1208;font-weight:700;font-size:13px;
  padding:9px 20px;border-radius:18px;opacity:0;transition:.35s cubic-bezier(.22,.9,.3,1);
  pointer-events:none;z-index:50;backdrop-filter:blur(8px);box-shadow:0 14px 36px -10px var(--glow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- calendar ---------- */
.seg{display:flex;background:var(--glass);border-radius:16px;padding:4px;width:fit-content;margin:0 auto 18px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.seg button{border:none;background:none;color:var(--dim);font-family:var(--mono);font-size:12px;
  font-weight:600;letter-spacing:1px;padding:7px 20px;border-radius:13px;cursor:pointer;transition:.2s;}
.seg button.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav button{background:var(--glass);border:none;color:var(--text);width:38px;height:38px;
  border-radius:13px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:.18s;}
.cal-nav button:active{transform:scale(.92);}
.cal-label{font-size:17px;font-weight:600;letter-spacing:.5px;}
.cal-label .yr{color:var(--dim);font-family:var(--mono);font-size:13px;margin-left:6px;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.dow{font-family:var(--mono);font-size:10px;color:var(--dimmer);text-align:center;padding:2px 0 6px;letter-spacing:1px;}
.cell{aspect-ratio:1/1.12;border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-family:var(--mono);font-size:12px;color:var(--dim);cursor:pointer;
  background:var(--glass);transition:.18s;position:relative;}
.cell.empty{background:none;cursor:default;}
.cell.future{opacity:.3;cursor:default;}
.cell.rec{color:#1a1208;font-weight:700;}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--ac);}
.cell:not(.empty):not(.future):active{transform:scale(.93);}
.cell .cdot{width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.45);}
.cell.norec .cdot{display:none;}
.cell.norec{color:var(--dimmer);}
/* year pixels */
.ygrid{display:flex;flex-direction:column;gap:3px;}
.yrow{display:grid;grid-template-columns:20px repeat(31,1fr);gap:3px;align-items:center;}
.yml{font-family:var(--mono);font-size:9px;color:var(--dimmer);text-align:right;padding-right:2px;}
.ycell{aspect-ratio:1;border-radius:3px;background:var(--glass-2);cursor:pointer;}
.ycell.blank{background:none;cursor:default;}
.ycell.future{background:rgba(255,255,255,.02);cursor:default;}
.ylegend{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;
  font-family:var(--mono);font-size:9px;color:var(--dimmer);letter-spacing:.5px;}
.ylegend .cells{display:flex;gap:4px;}
.ylegend .lc{width:13px;height:13px;border-radius:4px;}

/* ---------- insights ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tile{background:var(--glass);border-radius:22px;padding:18px 10px;text-align:center;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--glass-line);}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.5px;}
.tile .v small{font-size:12px;color:var(--dim);font-weight:500;}
.tile .t{font-size:11px;color:var(--dim);margin-top:5px;}
.dist-row{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.dist-face{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.dist-name{font-size:12.5px;color:var(--dim);width:62px;flex-shrink:0;}
.bar-wrap{flex:1;height:8px;background:var(--glass-2);border-radius:5px;overflow:hidden;}
.bar{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,.9,.3,1);}
.dist-n{font-family:var(--mono);font-size:11px;color:var(--dimmer);width:24px;text-align:right;}
.tag-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;}
.tag-row .nm{flex:1;display:flex;align-items:center;gap:6px;}
.tag-row .ct{font-family:var(--mono);font-size:12px;color:var(--dim);}
.empty-note{font-size:13px;color:var(--dimmer);padding:6px 2px;line-height:1.7;}

/* ---------- correlation ---------- */
.corr-hint{font-size:12.5px;color:var(--dim);margin:8px 0 18px;line-height:1.6;}
.corr-list{display:flex;flex-direction:column;gap:12px;}
.corr-row{display:flex;align-items:center;gap:10px;}
.corr-tag{font-size:13px;font-weight:500;width:64px;flex-shrink:0;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;}
.corr-n{font-family:var(--mono);font-size:10px;color:var(--dimmer);width:28px;text-align:right;flex-shrink:0;}
.corr-bar-wrap{flex:1;height:10px;position:relative;display:flex;align-items:center;}
.corr-center{position:absolute;left:50%;width:1px;height:16px;background:var(--glass-line);transform:translateX(-.5px);}
.corr-bar{height:100%;border-radius:5px;position:absolute;transition:width .6s cubic-bezier(.22,.9,.3,1);}
.corr-bar.pos{left:50%;border-radius:0 5px 5px 0;}
.corr-bar.neg{right:50%;border-radius:5px 0 0 5px;}
.corr-delta{font-family:var(--mono);font-size:11px;font-weight:600;width:42px;text-align:right;flex-shrink:0;}
.corr-delta.pos{color:var(--ac);}
.corr-delta.neg{color:var(--m2);}
.corr-insights{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.corr-insight{font-size:13px;color:var(--dim);line-height:1.6;padding:12px 16px;border-radius:16px;background:var(--glass);}
.corr-insight.pos{border-left:3px solid var(--ac);}
.corr-insight.neg{border-left:3px solid var(--m2);}
.ci-tag{font-weight:600;color:var(--text);}
.ci-val{font-family:var(--mono);font-size:11px;color:var(--dimmer);}

/* ---------- export ---------- */
.exp-btn{width:100%;text-align:left;background:var(--glass);border:none;border-radius:24px;
  padding:20px;color:var(--text);cursor:pointer;margin-bottom:12px;display:flex;align-items:center;gap:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--glass-line);transition:.18s;}
.exp-btn:active{transform:scale(.98);}
.exp-ic{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);}
.exp-ic svg{width:22px;height:22px;}
.exp-btn .nm{font-size:15px;font-weight:600;}
.exp-btn .ds{font-size:12px;color:var(--dim);margin-top:3px;}

/* ---------- bottom sheet ---------- */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;
  align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{width:100%;background:rgba(24,22,24,.82);backdrop-filter:blur(34px) saturate(1.5);
  -webkit-backdrop-filter:blur(34px) saturate(1.5);border-radius:34px 34px 0 0;
  box-shadow:inset 0 1px 0 var(--glass-line);padding:14px 24px calc(28px + env(safe-area-inset-bottom));
  max-height:86%;overflow-y:auto;transform:translateY(100%);transition:transform .34s cubic-bezier(.22,.9,.3,1);
  scrollbar-width:none;}
.sheet::-webkit-scrollbar{display:none;}
.overlay.show .sheet{transform:none;}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 16px;}
.sheet-date{font-size:18px;font-weight:600;letter-spacing:.3px;margin-bottom:14px;}
.mood-pill{display:inline-flex;align-items:center;gap:9px;padding:8px 16px 8px 8px;border-radius:20px;
  font-size:14px;font-weight:600;color:#1a1208;margin-bottom:6px;}
.mood-pill .mp-face{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.12);}
.d-sec{margin-top:18px;}
.d-lbl{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.d-text{font-size:14.5px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.d-tags{display:flex;flex-wrap:wrap;gap:8px;}
.d-tag{padding:6px 13px;border-radius:14px;font-size:13px;color:var(--text);
  background:color-mix(in srgb,var(--ac) 14%,transparent);box-shadow:inset 0 0 0 1px var(--hair);
  display:inline-flex;gap:6px;align-items:center;}
.d-tag.neg{background:color-mix(in srgb,var(--m2) 20%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--m2) 40%,transparent);}
.del-btn{margin-top:24px;width:100%;background:none;border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);
  color:var(--danger);padding:13px;border-radius:16px;font-size:14px;font-family:var(--sans);cursor:pointer;transition:.18s;}
.del-btn:active{transform:scale(.98);background:color-mix(in srgb,var(--danger) 12%,transparent);}
.sheet .moods{margin:8px 0 4px;}
.primary{margin-top:22px;width:100%;background:var(--ac);color:#1a1208;border:none;border-radius:18px;
  padding:15px;font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:.18s;
  box-shadow:0 14px 36px -12px var(--glow);}
.primary:disabled{opacity:.3;box-shadow:none;cursor:default;}
.primary:not(:disabled):active{transform:scale(.98);}
.sheet .ta-card{margin-top:12px;}
/* tag manager */
.tm-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);}
.tm-nm{flex:1;background:var(--glass-2);border:none;border-radius:12px;color:var(--text);
  padding:9px 12px;font-size:14px;font-family:var(--sans);outline:none;}
.tm-nm:focus{outline:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 50%,transparent);}
.tm-del{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;}
.tm-neg{flex:0 0 auto;border:none;border-radius:11px;padding:8px 11px;font-size:11px;font-weight:600;
  font-family:var(--sans);cursor:pointer;background:color-mix(in srgb,var(--ac) 14%,transparent);
  color:var(--ac);transition:.18s;white-space:nowrap;}
.tm-neg.on{background:color-mix(in srgb,var(--m2) 26%,transparent);color:var(--m2);}
.tm-add{display:flex;gap:9px;margin-top:14px;}
.tm-add .primary{margin-top:0;padding:0 18px;flex:0 0 auto;width:auto;}
.tm-ic-wrap{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--dim);}
.tm-ic-wrap .tag-ic{width:16px;height:16px;opacity:1;}
.tm-grp{flex:0 0 auto;border:none;border-radius:11px;padding:8px 10px;font-size:12px;font-weight:600;
  font-family:var(--sans);cursor:pointer;background:var(--glass-2);color:var(--dim);outline:none;
  appearance:none;-webkit-appearance:none;}

/* ---------- hero top row + icon button ---------- */
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.icon-btn{flex:0 0 auto;width:40px;height:40px;border-radius:14px;background:var(--glass);border:none;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:.18s;margin-top:6px;}
.icon-btn:active{transform:scale(.92);}
.icon-btn svg{width:21px;height:21px;}

/* ---------- photo ---------- */
.photo-add{display:inline-flex;align-items:center;gap:8px;padding:11px 17px;border-radius:18px;
  font-size:13.5px;color:var(--dim);font-weight:500;background:var(--glass);cursor:pointer;border:none;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:.18s;margin-top:14px;}
.photo-add:active{transform:scale(.96);}
.photo-add svg{width:17px;height:17px;}
.photo-wrap{margin-top:14px;position:relative;border-radius:20px;overflow:hidden;line-height:0;
  box-shadow:inset 0 1px 0 var(--glass-line),0 18px 44px -28px rgba(0,0,0,.85);}
.photo-wrap img{width:100%;max-height:260px;object-fit:cover;display:block;}
.photo-rm{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;backdrop-filter:blur(8px);line-height:1;}
.d-photo{margin-top:14px;border-radius:18px;overflow:hidden;line-height:0;}
.d-photo img{width:100%;display:block;}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;
  border-bottom:1px solid var(--hair);}
.set-row .st{font-size:14.5px;font-weight:500;}
.set-row .sd{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5;}
.sw{flex:0 0 auto;width:48px;height:29px;border-radius:15px;background:var(--glass-2);position:relative;
  cursor:pointer;border:none;transition:.22s;}
.sw.on{background:var(--ac);}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:.22s cubic-bezier(.34,1.45,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.3);}
.sw.on::after{transform:translateX(19px);}
.time-input{background:var(--glass-2);border:none;border-radius:12px;color:var(--text);
  padding:9px 12px;font-size:15px;font-family:var(--mono);outline:none;color-scheme:dark;}
.time-input:focus{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 50%,transparent);}

/* ---------- period filter ---------- */
.pf{display:flex;gap:4px;margin:0 0 20px;background:var(--glass);border-radius:14px;padding:3px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.pf-btn{flex:1;border:none;background:none;color:var(--dim);font-family:var(--mono);font-size:12px;
  font-weight:600;letter-spacing:1px;padding:8px 0;border-radius:11px;cursor:pointer;transition:.2s;}
.pf-btn.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);}

/* ---------- mood chart ---------- */
.chart-wrap{background:var(--glass);border-radius:22px;padding:16px 12px 10px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 1px 0 var(--glass-line);overflow:hidden;}
.chart-svg{width:100%;display:block;}
.chart-ylabel{font-family:var(--mono);font-size:8px;fill:var(--dimmer);letter-spacing:.5px;}
.chart-tag-label{font-family:var(--mono);font-size:8px;fill:var(--dim);letter-spacing:.5px;}

/* ---------- accordion ---------- */
.acc{max-height:0;overflow:hidden;opacity:0;
  transition:max-height .5s cubic-bezier(.22,.9,.3,1),opacity .35s;}
.acc.open{max-height:2000px;opacity:1;}

/* ---------- recent record cards ---------- */
.rec-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.rec-card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;padding:14px 16px;cursor:pointer;transition:.18s;
  box-shadow:inset 0 1px 0 var(--glass-line);}
.rec-card:active{transform:scale(.98);}
.rec-head{display:flex;align-items:center;justify-content:space-between;}
.rec-date{font-size:13px;color:var(--dim);font-weight:500;letter-spacing:.3px;}
.rec-mood{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rec-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.rec-tag{font-size:11px;padding:3px 8px;border-radius:8px;color:var(--dim);
  background:var(--glass-2);white-space:nowrap;}
.rec-tag.neg{color:var(--m2);}
.rec-tag.more{color:var(--dimmer);}
.rec-note{font-size:12.5px;color:var(--dimmer);margin-top:7px;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- settings extras ---------- */
.set-divider{height:1px;background:var(--hair);margin:20px 0 8px;}
.set-btn{flex:1;background:var(--glass);border:none;border-radius:14px;padding:12px 14px;
  color:var(--text);font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:.18s;
  box-shadow:inset 0 1px 0 var(--glass-line);}
.set-btn:active{transform:scale(.97);}
.set-btn.full{width:100%;text-align:center;}

/* ---------- dim (low-count items) ---------- */
.dim{opacity:.45;}

/* ---------- explicit save button ---------- */
.save-btn{position:sticky;bottom:8px;z-index:10;display:block;width:calc(100% - 12px);margin:18px auto 6px;
  background:var(--ac);color:#1a1208;border:none;border-radius:20px;padding:15px 24px;
  font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;
  box-shadow:0 14px 36px -12px var(--glow);transition:.25s cubic-bezier(.22,.9,.3,1);}
.save-btn:active{transform:scale(.97);}
.save-btn.pulse{animation:savePulse 1.8s ease-in-out infinite;}
@keyframes savePulse{0%,100%{box-shadow:0 14px 36px -12px var(--glow);}50%{box-shadow:0 14px 48px -8px var(--glow);}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="prototype/bundle.jsx"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed:', e));
  });
}
</script>
</body>
</html>
